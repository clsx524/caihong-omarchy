name: Validate release sources

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve pinned sources
        run: scripts/prepare-sources.sh
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y binutils desktop-file-utils libarchive-tools rpm shellcheck zstd
      - name: Validate scripts
        run: |
          set -euo pipefail
          find scripts caihong-linux-rootfs/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n caihong-linux-rootfs/packaging/power-profiles-daemon-caihong/build-rootfs-package.sh
          sh -n \
            caihong-linux-rootfs/packaging/linux-caihong/install-current-slot \
            caihong-linux-rootfs/packaging/linux-caihong/linux-caihong.install \
            caihong-linux-rootfs/config/armada.env
          python3 -m compileall -q caihong-linux-rootfs/scripts
          python3 caihong-linux-rootfs/tools/test-rootfs-camera-policy.py
          python3 caihong-linux-rootfs/tools/test-platform-payload.py
          python3 caihong-linux-rootfs/tools/test-platform-manifest.py
          python3 caihong-linux-rootfs/tools/test-platform-ssc-package.py
          python3 caihong-linux-rootfs/tools/test-release-packages.py
          python3 caihong-linux-rootfs/tools/test-build-root-resolver.py
          python3 caihong-linux-rootfs/tools/test-adbd-serial.py
          python3 caihong-linux-rootfs/tools/test-rootfs-runtime.py
          python3 caihong-linux-rootfs/tools/test-display-manager-migration.py
          python3 caihong-linux-rootfs/tools/test-hardware-mac.py
          python3 caihong-linux-rootfs/tools/test-caihong-autocharge.py
          python3 caihong-linux-rootfs/tools/test-caihong-flashlight-panel.py
          python3 caihong-linux-rootfs/tools/test-install-caihong-modules.py
          python3 caihong-linux-rootfs/tools/test-caihong-boot-provider.py
          node --test caihong-linux-rootfs/tools/test-release-artifacts.mjs
          shellcheck -x \
            scripts/lib.sh \
            scripts/prepare-sources.sh \
            scripts/refresh-patches.sh \
            scripts/update-dep.sh \
            scripts/verify-patches.sh \
            caihong-linux-rootfs/scripts/build-boot-v2.sh \
            caihong-linux-rootfs/scripts/build-kernel-release.sh \
            caihong-linux-rootfs/scripts/build-linux-caihong-package.sh \
            caihong-linux-rootfs/scripts/build-linux-caihong-rpm.sh \
            caihong-linux-rootfs/scripts/build-caihong-platform-package.sh \
            caihong-linux-rootfs/scripts/checkout-dependencies.sh \
            caihong-linux-rootfs/scripts/install-caihong-adbd.sh \
            caihong-linux-rootfs/scripts/install-caihong-modules.sh \
            caihong-linux-rootfs/scripts/install-caihong-toolbox-rootfs.sh \
            caihong-linux-rootfs/scripts/install-caihong-vaapi-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-vaapi-rootfs.sh \
            caihong-linux-rootfs/scripts/caihong-build-root.sh \
            caihong-linux-rootfs/scripts/install-caihong-libcamera-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-plasma-camera-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-qbootctl-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-utilities-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-ppd-stage.sh \
            caihong-linux-rootfs/scripts/install-caihong-ssc-stage.sh \
            caihong-linux-rootfs/packaging/libssc/run-regression.sh \
            caihong-linux-rootfs/scripts/package-archlinuxarm-rootfs.sh \
            caihong-linux-rootfs/scripts/package-armada-rootfs.sh \
            caihong-linux-rootfs/scripts/verify-caihong-update-packages.sh \
            caihong-linux-rootfs/scripts/verify-armada-rootfs.sh \
            caihong-linux-rootfs/packaging/linux-caihong/install-current-slot \
            caihong-linux-rootfs/packaging/caihong-platform/configure-platform \
            caihong-linux-rootfs/packaging/caihong-platform/switch-display-manager.sh \
            caihong-linux-rootfs/packaging/power-profiles-daemon-caihong/build-rootfs-package.sh \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/sbin/caihong-bluetooth-autostart \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/sbin/caihong-hardware-mac \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/sbin/caihong-mark-boot-successful \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/libexec/caihong-adbd-serial \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/sbin/caihong-adbd-gadget \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/local/sbin/caihong-slot \
            caihong-linux-rootfs/scripts/ssc/install-rootfs.sh
          desktop-file-validate \
            caihong-linux-rootfs/rootfs/archlinuxarm/etc/xdg/autostart/caihong-flashlight-panel.desktop \
            caihong-linux-rootfs/rootfs/archlinuxarm/usr/share/applications/caihong-switch-to-android.desktop
      - name: Reject oversized repository objects
        run: |
          set -euo pipefail
          oversized=$(find . -path ./.git -prune -o -type f -size +95M -print)
          test -z "$oversized" || { printf '%s\n' "$oversized"; exit 1; }
      - name: Verify firmware inputs
        run: |
          (cd caihong-linux-rootfs/firmware && sha256sum -c SHA256SUMS)
          (cd caihong-linux-rootfs/firmware-assets/caihong-ssc && sha256sum -c SHA256SUMS)
